name = "sikuttar"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Free first deploy: same-origin SPA + API (no Vectorize / Workers AI)
[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
# Free path — Jaccard only (Paid/Vectorize gate separate)
SEMANTIC_SEARCH = "fallback"
# E12 question UI — template answers (ADR 0002 · no generative LLM)
SECRETARY_QA = "on"

[[d1_databases]]
binding = "DB"
database_name = "sikuttar"
database_id = "32bc066b-aa26-43e0-8d4d-3de566915ed3"
migrations_dir = "migrations"

