# Codename package — bootstrap (手順-スタートアップ)
# Owner: this file. Procedure body lives at factor owners — do not restate here.
status: registered
codename: 手順-スタートアップ-1
id: proc-startup
kind: procedure
category: launch
definition: "新規プロジェクトに .agents キット（プレーン）を配置し、verify まで通す"

variants:
  1:
    definition: "./.agents が copy-kit で配置済み"
    when: { agents_dir_exists: true }
  2:
    definition: "ゼロから。フォルダ作成 · git-init 込み"
    when: { agents_dir_exists: false }

inputs:
  required: [PROJECT_NAME, PROJECT_PATH]
  optional: [ONE_LINE_DESCRIPTION, TECH_STACK, STACK_LANG_DOC, STACK_FRAMEWORK_DOC, STYLE_GUIDE]
  on_missing: ask

brief:
  role: kit_maintainer
  phase: pre-P0
  skills: [maintain-bootstrap, maintain-record]
  factors:
    - act.bootstrap.copy_kit
    - act.bootstrap.git_init
    - act.bootstrap.root_agents_md
    - act.bootstrap.docs_skeleton
    - act.bootstrap.env_setup
    - act.bootstrap.memory_live
    - act.bootstrap.link_cursor
    - act.bootstrap.state_init
    - act.bootstrap.verify

caveats:
  - prop.bootstrap.no_whole_copy
  - prop.bootstrap.no_write_to_kit_home
  - prop.bootstrap.no_learning_copy
  - prop.bootstrap.no_p0_before_done

gate:
  confirm_before_run: false
  confirm_points: [git_remote]

done:
  - { check: verify_bootstrap, expect: "ISSUES=0" }
  - { check: file_is_pointer, path: .agents/memory/global/README.md }
  - { check: skeleton_only, path: .agents/learning/ }

recognizes:
  - "配置されたのはプレーンなキット。製品専用の内容（charter · 用語 · stack lens · rules/local）は未記入"
  - "キットの既定値・テンプレ文・_example を製品の事実として扱わない。製品の事実は P0 以降にユーザーと作る"
  - "nav.session.intent = bootstrap-done。P/H はまだ確定していない（project-state は P0/H0 初期値）"

then:
  - { to: proc-polaris, rel: next_act, default: true, label: "P0 概要議論（charter 草案）" }
  - { to: proc-voyager, rel: next_act, when: { utterance_tags: [learning, 学習, 調査] }, label: "先に学習トピックを開く" }

state_after:
  nav.next_actions: [proc-polaris]
  decay: D5
