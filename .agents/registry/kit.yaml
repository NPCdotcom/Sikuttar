# Kit-wide factors (I1 / I2). Not owned by a design/plan cluster.
status: registered
meta:
  cluster: kit
  recognition: kit_control_plane
factors:

  - id: prop.kit.no_subagent
    kind: prop
    text: "書込・実行・ゲート判断を伴う Subagent / Task と Hermes MCP は起動しない。読み取り専用の調査（コード/ドキュメント探索 · CI 失敗調査 · 製品ドキュメント参照）に限り Subagent 可。結果は PM が同一チャットで統合し、brief/nav への書込は PM のみ（prop.kit.role_execute_pm_only）"
    owner: rules/no-subagents.mdc
    why: docs/CURSOR_SUBAGENT_POLICY.md

  - id: act.pm.turn_chain
    kind: act
    text: "pm-turn-start → role-execute → pm-turn-end の L1 鎖を辿る"
    owner: skills/_chains/pm-turn.md
    why: docs/MANDATORY_PROCEDURES.md
    cost: 1

  - id: act.pm.codename_dispatch
    kind: act
    text: "発話に完全形式コードネーム（区分-固有名-番号）があれば登録 brief を使い Loop1 brief 生成を省略"
    owner: skills/codename/SKILL.md
    why: docs/CODENAMES.md
    cost: 1

  - id: prop.kit.role_execute_pm_only
    kind: prop
    text: "Role 列スキルは PM（同一チャット）が実行する。Subagent に委譲しない"
    owner: skills/role-execute/SKILL.md
    why: docs/CURSOR_SUBAGENT_POLICY.md

  - id: prop.kit.control_plane_two_files
    kind: prop
    text: "制御面は nav.yaml と docs/project-state.yaml の二ファイル"
    owner: rules/kit-context-routing.mdc
    why: docs/MEMORY_ARCHITECTURE.md

  - id: prop.memory.nav_update_every_turn
    kind: prop
    text: "毎ターン終端で nav.yaml を更新する"
    owner: skills/lib-memory-io/SKILL.md
    why: docs/MEMORY_ARCHITECTURE.md

  - id: prop.memory.nav_missing_is_error
    kind: prop
    text: "nav.yaml 欠落はエラー（黙ってスキップしない）"
    owner: skills/memory-reference/references/recall-workflow.md
    why: docs/MEMORY_ARCHITECTURE.md

  - id: prop.memory.next_decay
    kind: prop
    text: "nav.next_actions は 3 ターン未再主張で落とす。phase_bound は gate/phase 前進で消す。episodes は減衰しない"
    owner: skills/memory-record/references/nav-decay.md
    why: docs/MEMORY_ARCHITECTURE.md

  - id: prop.state.loop1_quote_loop2_sync
    kind: prop
    text: "Loop1 は引用 · Loop2 は同期（recall 手順）"
    owner: skills/memory-reference/references/recall-workflow.md
    why: docs/MEMORY_ARCHITECTURE.md

  - id: prop.state.gate_write_pm_confirm
    kind: prop
    text: "gate 書込は PM 確認後のみ"
    owner: skills/memory-record/references/write-scope.md
    why: docs/COLLABORATION_CONTRACT.md

  - id: prop.learning.no_project_state_write
    kind: prop
    text: "learning/ 作業中は project-state / 本番制御面へ書かない"
    owner: rules/learning-sandbox.mdc
    why: docs/LEARNING_AND_PROMOTION.md

  - id: prop.kit.docs_do_not_restate_factors
    kind: prop
    text: "docs は因子本文を再説明しない。id 参照のみ。理由（why）は docs が所有"
    owner: skills/maintain-adhoc/references/factor-split-checks.md
    why: docs/DESIGN_SEMANTICS.md

  - id: prop.kit.factors_do_not_carry_rationale
    kind: prop
    text: "因子に理由文を書かない。why は docs パスのみ"
    owner: skills/maintain-adhoc/references/factor-split-checks.md
    why: docs/DESIGN_SEMANTICS.md
