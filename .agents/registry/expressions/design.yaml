# Expression surfaces for C6a-design (SKILL.md / mdc generation input)
# description: fallback only when target lacks description; never overwrite existing

expressions:
  - name: design-record
    kind: skill
    description: "Write design/requirements markdown under docs/ (P0–P3, spec_designer)"
    factors:
      - act.design.record
      - act.design.update_index
      - act.design.handoff_plan
      - prop.design.terminology_first
      - prop.design.agreed_requires_user_confirm
      - prop.design.write_bounds
      - path.design.P0
      - path.design.P1_P2
      - path.design.P3
      - template.design.record

  - name: design-deliberate
    kind: skill
    description: "Compare design options and write deliberation notes (spec_designer)"
    factors:
      - act.design.identify_unfixed_h
      - act.design.deliberate
      - prop.design.terminology_first
      - prop.design.no_forced_class_hierarchy
      - prop.design.agreed_requires_user_confirm
      - template.design.deliberation

  - name: design-reference
    kind: skill
    description: "Search prior design/requirements/ADR before writing (spec_designer)"
    factors:
      - act.design.search_prior
      - prop.design.cite_facts_assumptions_open
      - path.design.infra

  - name: design-stewardship
    kind: rule
    path: rules/design-stewardship.mdc
    description: "P0-P3—Cursor role spec_designer—specs and deliberation in docs/design/ and requirements/; not main PM"
    factors:
      - prop.design.terminology_first
      - prop.design.no_forced_class_hierarchy
      - prop.design.agreed_requires_user_confirm
      - prop.design.write_bounds
      - prop.design.cite_facts_assumptions_open
      - cap.research.terminology
