# C6a-design — registered from F2 sketch (learning notes read-only; not written back)
status: registered
meta:
  cluster: C6a-design
  recognition: spec_designer
  phase: [P0, P1, P2, P3]
  factors_total: 19

factors:

  # ---------- prop ----------
  - id: prop.design.terminology_first
    kind: prop
    text: "P0–P3 で 要求/要件/設計 の用語を扱う前に terminology-research の alignment が存在すること。無ければ block"
    when: { phase: [P0, P1, P2, P3] }
    why: docs/TERMINOLOGY_RESEARCH_POLICY.md
    dup: [design-stewardship.mdc#When, design-stewardship.mdc#Mandatory, search-order.md#0, workflow-detail.md#0, prerequisites.md#Terminology]

  - id: prop.design.agreed_requires_user_confirm
    kind: prop
    text: "frontmatter status: agreed はユーザー確認後のみ"
    when: { writes: [docs/design/**, docs/requirements/**] }
    why: docs/COLLABORATION_CONTRACT.md
    dup: [design-deliberate/SKILL.md#Do-not, workflow-detail.md#Do-not, prerequisites.md#User-confirm]

  - id: prop.design.no_forced_class_hierarchy
    kind: prop
    text: "設計の選択肢をクラス階層一択にしない。認識と因子を分けて書く"
    when: { phase: [P0, P1, P2, P3] }
    why: docs/DESIGN_SEMANTICS.md
    dup: [design-stewardship.mdc#Design-semantics, workflow-detail.md#3, workflow-detail.md#Do-not]

  - id: prop.design.write_bounds
    kind: prop
    text: "spec_designer が書くのは docs/design · docs/requirements · docs/adr · docs/glossary。.agents/plans とアプリコードは書かない"
    when: { role: [spec_designer] }
    why: docs/ROLES_AND_GOVERNANCE.md
    dup: [design-reference/SKILL.md, design-deliberate/SKILL.md#Do-not, workflow-detail.md, prerequisites.md#Out-of-scope, design-stewardship.mdc, full-catalog.md]

  - id: prop.design.cite_facts_assumptions_open
    kind: prop
    text: "引用は path + section。本文は Facts / Assumptions / Open を分ける"
    when: { role: [spec_designer] }
    why: docs/COLLABORATION_CONTRACT.md
    dup: [search-order.md#6, design-record/SKILL.md#description]

  # ---------- act ----------
  - id: act.design.search_prior
    kind: act
    text: "glossary → requirements → design(H0→H5) → adr の順に既存を検索。status: agreed かつ現在の scope_level を優先"
    when: { phase: [P0, P1, P2, P3] }
    cost: 1
    writes: []
    next:
      - { rel: next_act, to: act.design.deliberate, when: { h_unfixed: true } }
      - { rel: next_act, to: act.design.record, when: { deliberation_exists: true } }
    owner: skills/design-reference/references/search-order.md

  - id: act.design.identify_unfixed_h
    kind: act
    text: "lifecycle-reference で未確定の H レベルを特定する"
    cost: 1
    next: [{ rel: next_act, to: act.design.deliberate }]
    owner: skills/design-deliberate/references/workflow-detail.md

  - id: act.design.deliberate
    kind: act
    text: "Goal 1 文 → Options 2–4（pros/cons · おすすめ 1）→ Recommendation + assumptions → Open questions → `>` 殴り書き欄"
    when: { phase: [P0, P1, P2, P3] }
    cost: 3
    writes: [docs/design/<topic>.deliberation.md]
    requires: [prop.design.terminology_first, prop.design.no_forced_class_hierarchy]
    next:
      - { rel: next_act, to: act.design.record, when: { user_confirmed: true } }
      - { rel: next_read, to: docs/DESIGN_SEMANTICS.md#3, when: { utterance_tags: [class, inheritance, object] } }
    owner: skills/design-deliberate/references/workflow-detail.md

  - id: act.design.record
    kind: act
    text: "設計/要求/要件を frontmatter 付きで書く。Recognition / Factors を節で分ける。deliberation 由来なら promoted_from を付ける。scope_level を設定"
    when: { phase: [P0, P1, P2, P3] }
    cost: 3
    writes: [docs/design/**, docs/requirements/**]
    requires: [prop.design.terminology_first, prop.design.agreed_requires_user_confirm]
    next:
      - { rel: next_act, to: act.doc.frontmatter_validate }
      - { rel: next_act, to: act.design.update_index }
    owner: skills/design-record/references/save-paths-by-phase.md

  - id: act.design.update_index
    kind: act
    text: "docs/README.md または requirements README の索引を更新"
    cost: 1
    writes: [docs/README.md, docs/requirements/README.md]
    next: [{ rel: next_act, to: act.design.handoff_plan, when: { phase: P3, h_level: [H4, H5] } }]
    owner: skills/design-record/references/save-paths-by-phase.md

  - id: act.design.handoff_plan
    kind: act
    text: "P3 gate 通過 + H4/H5 設計あり → plan_slicer へ引き渡し"
    when: { phase: P3 }
    cost: 1
    next: [{ rel: next_act, to: act.plan.record }]
    owner: skills/design-record/references/prerequisites.md

  - id: act.doc.frontmatter_validate
    kind: act
    text: "lib-doc-frontmatter の必須キーを検証"
    cost: 1
    owner: skills/lib-doc-frontmatter/SKILL.md
    # also listed in registry/shared.yaml (canonical shared home)

  # ---------- path ----------
  - id: path.design.P0
    kind: path
    text: docs/design/product/
    when: { phase: P0 }

  - id: path.design.P1_P2
    kind: path
    text: "docs/requirements/<slug>/要求.md | 要件.md"
    when: { phase: [P1, P2] }

  - id: path.design.P3
    kind: path
    text: "docs/design/{elements,systems,frameworks,programs}/"
    when: { phase: P3 }

  - id: path.design.infra
    kind: path
    text: "docs/design/_template/infrastructure/ → docs/design/systems/<slug>/"
    when: { utterance_tags: [IaC, cloud] }

  # ---------- template ----------
  - id: template.design.deliberation
    kind: template
    text: docs/design/_deliberation-template.md

  - id: template.design.record
    kind: template
    text: skills/doc-record/assets/templates/design.md

  # ---------- cap ----------
  - id: cap.research.terminology
    kind: cap
    text: "WebSearch + browser による用語 alignment（terminology-research）"
    provided_by: skills/terminology-research
    # also listed in registry/shared.yaml (canonical shared home)

edges: []
