# Selection rule
# 1. Extract 1–3 intent tags from the user message (e.g. [git, commit] · [phase, gate] · [memory]).
# 2. Pick the doc whose tags intersect most; ties → lower `lines`.
# 3. Load that ONE doc (L3) or the L2 pointer. Log the choice in the turn episode `context_loaded:`.
