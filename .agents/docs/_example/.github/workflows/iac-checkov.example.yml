# Example: Checkov on IaC (pull request)
# Copy to .github/workflows/iac-checkov.yml and adjust paths.
name: IaC Checkov

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/iac-checkov.yml"

permissions:
  contents: read
  security-events: write

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/
          framework: terraform
          soft_fail: false
          output_format: sarif
          output_file_path: checkov.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
